version: '3.8'

services:
  # 后端 API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knowhub-backend
    ports:
      - "8000:8000"
    volumes:
      - ./documents:/app/documents
      - ./vector_db:/app/vector_db
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
    environment:
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-your-api-key-here}
      - PYTHONIOENCODING=utf-8
      - SQLITE_BUSY_TIMEOUT=5000
      - DB_DIR=/app/data
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8000,http://localhost:5173,http://localhost}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    restart: unless-stopped
    networks:
      - knowhub-net

  # 前端
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: knowhub-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - knowhub-net

networks:
  knowhub-net:
    driver: bridge
