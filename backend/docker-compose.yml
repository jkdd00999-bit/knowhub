version: '3.8'

services:
  # 后端 API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knowhub-backend
    ports:
      - "8000:8000"
    volumes:
      - ./documents:/app/documents
      - ./vector_db:/app/vector_db
      - ./chroma_db:/app/chroma_db
      - ./knowhub.db:/app/knowhub.db
    environment:
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-your-api-key-here}
      - PYTHONIOENCODING=utf-8
    restart: unless-stopped
    networks:
      - knowhub-net

  # 前端
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: knowhub-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - knowhub-net

networks:
  knowhub-net:
    driver: bridge

volumes:
  documents:
  vector_db:
  chroma_db:
