version: '3.8'

services:
  # 后端 API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knowhub-backend
    ports:
      - "8000:8000"
    volumes:
      - ./documents:/app/documents
      - ./vector_db:/app/vector_db
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
    environment:
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-your-api-key-here}
      - PYTHONIOENCODING=utf-8
      - SQLITE_BUSY_TIMEOUT=5000
      - DB_DIR=/app/data
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8000,http://localhost:5173,http://localhost}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      # HuggingFace 镜像加速（国内用户建议在 .env 中设置）
      - HF_ENDPOINT=${HF_ENDPOINT:-}
      # Redis 配置（可选，不设置则自动跳过缓存）
      - REDIS_HOST=${REDIS_HOST:-localhost}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      # 邮件推送配置（可选，订阅推送功能需要）
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
    restart: unless-stopped
    networks:
      - knowhub-net

  # 前端
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: knowhub-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - knowhub-net

networks:
  knowhub-net:
    driver: bridge
